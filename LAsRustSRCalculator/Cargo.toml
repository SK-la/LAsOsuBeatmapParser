[package]
name = "rust_sr_calculator"
version = "1.0.0"
edition = "2024"

[lib]
name = "rust_sr_calculator"
crate-type = ["rlib", "cdylib"]

[dependencies]
wasmi = { version = "1.0.9", default-features = false, features = ["std", "simd"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
